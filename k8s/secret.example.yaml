# Template only — NOT applied by kustomization.yaml, and never holds real values.
#
# The live Secret is created out of band so that credentials never enter Git:
#
#   kubectl create secret generic agent-builder-secret \
#     -n tas-agent-builder \
#     --from-literal=DB_USER=tasuser \
#     --from-literal=DB_PASSWORD="$DB_PASSWORD" \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 36 | tr -d '\n' | tr '+/' '-_')" \
#     --from-literal=ROUTER_API_KEY="" \
#     --from-literal=DEEPLAKE_API_KEY=""
#
# Read the live values with:
#   kubectl get secret agent-builder-secret -n tas-agent-builder -o jsonpath='{.data.JWT_SECRET}' | base64 -d
#
# History note: until 2026-09-17 this file was `secret.yaml`, carried literal
# values, and was listed in kustomization.yaml — so `kubectl apply -k k8s/`
# overwrote the live Secret with whatever was committed here. The JWT_SECRET it
# held was the one production used; it was rotated on 2026-09-17. Every value
# this file ever held remains in Git history, so treat them all as public and
# rotate rather than relying on this deletion.
apiVersion: v1
kind: Secret
metadata:
  name: agent-builder-secret
  namespace: tas-agent-builder
  labels:
    app: agent-builder
type: Opaque
stringData:
  # Shared PostgreSQL credentials (postgres-shared.tas-shared).
  DB_USER: "REPLACE_ME"
  DB_PASSWORD: "REPLACE_ME"

  # HMAC secret for locally minted tokens. Keycloak tokens are RSA-verified
  # against the realm's published keys and do not use this value.
  JWT_SECRET: "REPLACE_ME"

  # Optional. Empty in the cluster; the router client omits the header when unset.
  ROUTER_API_KEY: ""

  # Optional. Empty in the cluster; must match DEV_DEFAULT_API_KEY on deeplake-api when set.
  DEEPLAKE_API_KEY: ""
