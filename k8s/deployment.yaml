apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-builder
  namespace: tas-agent-builder
  labels:
    app: agent-builder
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-builder
  template:
    metadata:
      labels:
        app: agent-builder
        component: api
    spec:
      # Spread replicas across nodes (cluster gained pinova01 2026-09-21).
      # Safe since the cluster LAN went in: measured 2026-09-21, 3,703
      # sequential Postgres connects in 10s from the other node vs 3,793
      # locally -- a 2.4% penalty. Over WiFi it was ~70ms per round trip.
      #
      # topologySpreadConstraints, not podAntiAffinity, which was measured
      # putting both replicas on the SAME node. A rollout alone may still
      # co-locate them; check placement and delete one pod to rebalance.
      #
      # ScheduleAnyway: with two nodes a hard constraint would leave a replica
      # Pending whenever one node is down.
      #
      # NOTE: apply with `kubectl apply -k k8s/`, NOT `-f`. The live selector
      # carries this kustomization's commonLabels, which the raw file lacks,
      # so a bare -f is rejected on the immutable selector (OPS-30 Case B).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: agent-builder
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          echo "Waiting for PostgreSQL to be ready..."
          until nc -z postgres-shared.tas-shared 5432; do
            echo "PostgreSQL is unavailable - sleeping"
            sleep 2
          done
          echo "PostgreSQL is up - proceeding"
      containers:
      - name: agent-builder
        image: agent-builder:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8087
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: agent-builder-config
        - secretRef:
            name: agent-builder-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8087
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8087
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
